<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu perfil — RoomToWORK</title>
  <link rel="stylesheet" href="/src/styles/formularios.css">
  <link rel="stylesheet" href="/src/styles/anunciar.css">
  <link rel="stylesheet" href="/src/styles/perfil.css">
</head>
<body>
  <main class="container perfil">
    <a href="/" class="link-voltar">Voltar ao catálogo</a>
    <h1>Meu perfil</h1>
    <p id="estado" role="status">Carregando perfil…</p>
    <div id="conteudo" hidden>
      <form id="formPerfil">
        <h2>Meus dados</h2>
        <label for="nome">Nome completo</label>
        <input id="nome" autocomplete="name" minlength="2" maxlength="120" required>
        <label for="nascimento">Data de nascimento</label>
        <input id="nascimento" type="date" autocomplete="bday">
        <label for="telefone">WhatsApp com DDD</label>
        <input id="telefone" type="tel" inputmode="numeric" maxlength="15" autocomplete="tel">
        <label for="cpf">CPF</label>
        <input id="cpf" inputmode="numeric" maxlength="14">
        <label for="cep">CEP</label>
        <input id="cep" inputmode="numeric" maxlength="9" autocomplete="postal-code">
        <label for="endereco">Endereço</label>
        <input id="endereco" maxlength="200" autocomplete="address-line1">
        <div class="perfil-linha">
          <div><label for="numero">Número</label><input id="numero" maxlength="20"></div>
          <div><label for="bairro">Bairro</label><input id="bairro" maxlength="100"></div>
        </div>
        <div class="perfil-linha">
          <div><label for="cidade">Cidade</label><input id="cidade" maxlength="100" autocomplete="address-level2"></div>
          <div><label for="uf">UF</label><input id="uf" maxlength="2" autocomplete="address-level1"></div>
        </div>
        <button type="submit" class="login" id="salvar">Salvar dados</button>
        <p id="mensagem" role="status"></p>
      </form>
      <form id="formEmail">
        <label for="email">E-mail da conta</label>
        <input id="email" type="email" autocomplete="email" required>
        <button type="submit" class="login" id="salvarEmail">Alterar e-mail</button>
        <p id="mensagemEmail" role="status"></p>
      </form>
      <section id="meusAnuncios">
        <h2>Meus anúncios</h2>
        <p id="estadoAnuncios" role="status">Carregando anúncios…</p>
        <ul id="listaAnuncios"></ul>
        <a class="perfil-link" href="/anunciar/">Anunciar espaço</a>
      </section>
      <nav class="perfil-navegacao" aria-label="Conta">
        <a href="/reservas/">Minhas reservas</a>
        <a href="/login/?recuperar=1">Alterar senha</a>
        <button type="button" id="sair">Sair da conta</button>
      </nav>
    </div>
  </main>
  <script type="module" src="/src/pages/perfil.js"></script>
</body>
</html>
